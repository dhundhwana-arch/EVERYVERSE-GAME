services:
  - type: web
    name: lifeverse-2070-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r 02_BACKEND/requirements.txt
    startCommand: PYTHONPATH=02_BACKEND uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LIFEVERSE_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MODERATION_CONFIG_PATH
        value: /etc/secrets/private_moderation_config.json
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
